<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather Dashboard</title>
    <style>
        /* CSS STYLES */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .dashboard {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: #dc3545;
            display: none;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }

        .weather-info {
            display: none;
        }

        #cityName {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        .metric {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #007bff;
        }

        .metric-label {
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- HTML STRUCTURE -->
    <div class="dashboard">
        <h2>Weather Dashboard</h2>
        <div class="search-container">
            <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>
        
        <div id="errorMessage" class="error"></div>

        <div id="weatherData" class="weather-info">
            <h3 id="cityName"></h3>
            <div class="metric">
                <span class="metric-label">Temperature:</span>
                <span id="tempValue"></span>
            </div>
            <div class="metric">
                <span class="metric-label">Humidity:</span>
                <span id="humidityValue"></span>
            </div>
            <div class="metric">
                <span class="metric-label">Wind Speed:</span>
                <span id="windValue"></span>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const errorMessage = document.getElementById('errorMessage');
        const weatherData = document.getElementById('weatherData');

        // Function to handle the asynchronous API requests
        const fetchWeather = async (city) => {
            try {
                // Reset UI states
                errorMessage.style.display = 'none';
                weatherData.style.display = 'none';
                searchBtn.textContent = 'Loading...';
                searchBtn.disabled = true;

                // Step 1: Geocoding API - Convert city name to Latitude & Longitude
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
                if (!geoRes.ok) throw new Error('Network response was not ok');
                
                const geoData = await geoRes.json();
                
                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error('City not found. Please check your spelling and try again.');
                }

                const { latitude, longitude, name, country } = geoData.results[0];

                // Step 2: Weather API - Fetch current conditions using coordinates
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`);
                if (!weatherRes.ok) throw new Error('Failed to fetch weather data');

                const weatherDataJson = await weatherRes.json();
                
                // Extract nested JSON objects
                const current = weatherDataJson.current;
                const units = weatherDataJson.current_units;

                // Dynamically render the data to the DOM
                document.getElementById('cityName').textContent = `${name}, ${country}`;
                document.getElementById('tempValue').textContent = `${current.temperature_2m}${units.temperature_2m}`;
                document.getElementById('humidityValue').textContent = `${current.relative_humidity_2m}${units.relative_humidity_2m}`;
                document.getElementById('windValue').textContent = `${current.wind_speed_10m} ${units.wind_speed_10m}`;
                
                // Show the weather data container
                weatherData.style.display = 'block';

            } catch (error) {
                // Comprehensive error handling
                errorMessage.textContent = error.message || 'An unexpected error occurred.';
                errorMessage.style.display = 'block';
            } finally {
                // Reset button state regardless of success or failure
                searchBtn.textContent = 'Search';
                searchBtn.disabled = false;
            }
        };

        // Event Listeners for Search Button and Enter Key
        searchBtn.addEventListener('click', () => {
            const city = cityInput.value.trim();
            if (city) fetchWeather(city);
        });

        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const city = cityInput.value.trim();
                if (city) fetchWeather(city);
            }
        });
    </script>
</body>
</html>
